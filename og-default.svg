<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>
  <!-- Grid dots -->
  <g opacity="0.06" fill="#6366f1">
    <circle cx="80" cy="80" r="4"/><circle cx="160" cy="80" r="4"/><circle cx="240" cy="80" r="4"/>
    <circle cx="80" cy="160" r="4"/><circle cx="160" cy="160" r="4"/><circle cx="240" cy="160" r="4"/>
    <circle cx="960" cy="400" r="4"/><circle cx="1040" cy="400" r="4"/><circle cx="1120" cy="400" r="4"/>
    <circle cx="960" cy="480" r="4"/><circle cx="1040" cy="480" r="4"/><circle cx="1120" cy="480" r="4"/>
  </g>
  <!-- Logo -->
  <text x="96" y="230" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="800" fill="#ffffff">Nxt<tspan fill="#6366f1">Craft</tspan></text>
  <!-- Tagline -->
  <text x="96" y="302" font-family="system-ui,-apple-system,sans-serif" font-size="30" fill="#94a3b8" font-weight="400">Free tools for work, money &amp; productivity</text>
  <!-- Tool chips -->
  <g font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600">
    <rect x="96" y="360" width="160" height="40" rx="20" fill="#6366f120" stroke="#6366f140" stroke-width="1.5"/>
    <text x="176" y="384" fill="#a5b4fc" text-anchor="middle">EMI Calc</text>
    <rect x="272" y="360" width="160" height="40" rx="20" fill="#6366f120" stroke="#6366f140" stroke-width="1.5"/>
    <text x="352" y="384" fill="#a5b4fc" text-anchor="middle">SIP Calc</text>
    <rect x="448" y="360" width="160" height="40" rx="20" fill="#6366f120" stroke="#6366f140" stroke-width="1.5"/>
    <text x="528" y="384" fill="#a5b4fc" text-anchor="middle">PDF Tools</text>
    <rect x="624" y="360" width="170" height="40" rx="20" fill="#6366f120" stroke="#6366f140" stroke-width="1.5"/>
    <text x="709" y="384" fill="#a5b4fc" text-anchor="middle">Tax Calc</text>
    <rect x="96" y="420" width="180" height="40" rx="20" fill="#6366f120" stroke="#6366f140" stroke-width="1.5"/>
    <text x="186" y="444" fill="#a5b4fc" text-anchor="middle">AI Grammar</text>
    <rect x="292" y="420" width="160" height="40" rx="20" fill="#6366f120" stroke="#6366f140" stroke-width="1.5"/>
    <text x="372" y="444" fill="#a5b4fc" text-anchor="middle">DevLab</text>
    <rect x="468" y="420" width="180" height="40" rx="20" fill="#6366f120" stroke="#6366f140" stroke-width="1.5"/>
    <text x="558" y="444" fill="#a5b4fc" text-anchor="middle">HueLab</text>
    <rect x="664" y="420" width="195" height="40" rx="20" fill="#6366f120" stroke="#6366f140" stroke-width="1.5"/>
    <text x="761" y="444" fill="#a5b4fc" text-anchor="middle">+30 more</text>
  </g>
  <!-- URL -->
  <text x="96" y="558" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#475569">nxtcraft.github.io</text>
  <!-- Right decoration -->
  <circle cx="1050" cy="200" r="120" fill="#6366f1" opacity="0.07"/>
  <circle cx="1100" cy="300" r="80" fill="#8b5cf6" opacity="0.07"/>
</svg>
